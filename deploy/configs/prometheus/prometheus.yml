# Prometheus Configuration for Detectviz Platform
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'detectviz-monitor'
    environment: 'development'

# Alertmanager configuration (if using)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  # - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Detectviz Platform Services
  - job_name: 'detectviz-platform'
    static_configs:
      # Go Platform (ToolBridge)
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'detectviz-go-platform'
          component: 'toolbridge'
      
      # Python ADK Runtime
      - targets: ['host.docker.internal:8082']
        labels:
          service: 'detectviz-python-adk'
          component: 'adk-runtime'

  # Infrastructure Monitoring
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          type: 'infrastructure'

  # Database Monitoring
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          type: 'database'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          type: 'cache'

  # Grafana Monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          type: 'visualization'

  # Alloy Monitoring
  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:9999']
        labels:
          service: 'alloy'
          type: 'collector'

  # Loki Monitoring
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'
          type: 'logging'

  # Tempo Monitoring
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
        labels:
          service: 'tempo'
          type: 'tracing'

  # Pyroscope Monitoring
  - job_name: 'pyroscope'
    static_configs:
      - targets: ['pyroscope:4040']
        labels:
          service: 'pyroscope'
          type: 'profiling'

  # Service Discovery for Kubernetes (future)
  # - job_name: 'kubernetes-pods'
  #   kubernetes_sd_configs:
  #     - role: pod
  #   relabel_configs:
  #     - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
  #       action: keep
  #       regex: true