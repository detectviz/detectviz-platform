syntax = "proto3";

package detectviz.contracts.v1;
option go_package = "github.com/detectviz/detectviz-platform/contracts/gen/go/detectviz/contracts/v1;contractspb";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

message TenantContext {
  string tenant_id = 1;
  string project_id = 2;
  string environment = 3;
}

message TraceContext {
  string trace_id = 1;
  string span_id = 2;
  string parent_span_id = 3;
  string traceparent = 4;
}

message VersionContext {
  string platform_version = 1;
  string runtime_version = 2;
  string api_version = 3;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
  string version = 2;
}

message ToolInvokeRequest {
  string tool_id = 1;
  string tool_version = 2;
  google.protobuf.Struct payload = 3;
  uint32 timeout_ms = 4;
  map<string, string> metadata = 5;

  TenantContext tenant = 6;
  TraceContext  trace  = 7;
  VersionContext version = 8;
}

message ToolInvokeReply {
  google.protobuf.Struct result = 1;
  google.rpc.Status status = 2;
  ToolExecutionMeta exec_meta = 3;
}

message ToolChunk {
  google.protobuf.Struct chunk = 1;
}

message ToolExecutionMeta {
  uint32 attempt = 1;
  uint64 duration_ms = 2;
  string plugin_id = 3;
  string route_id = 4;
  google.protobuf.Timestamp finished_at = 5;
}

service ToolBridge {
  rpc Invoke(ToolInvokeRequest) returns (ToolInvokeReply);
  rpc InvokeStream(ToolInvokeRequest) returns (stream ToolChunk);
  rpc Healthz(HealthCheckRequest) returns (HealthCheckResponse);
}
