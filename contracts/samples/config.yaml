# Detectviz Platform Configuration
# Version: 2.0.0
# Updated: 2025-08-17

# ============================================
# Environment Configuration
# ============================================
env: ${DETECTVIZ_ENV:-development}
service:
  name: detectviz-platform
  version: 1.0.0
  instance_id: ${HOSTNAME:-detectviz-001}

# ============================================
# gRPC Configuration
# ============================================
grpc:
  listen: ${DETECTVIZ__GRPC__LISTEN:-:6606}
  max_recv_msg_size: 104857600 # 100MB
  max_send_msg_size: 104857600
  keepalive:
    time: 30s
    timeout: 10s
    min_time: 30s
  tls:
    enabled: false
    cert_file: ""
    key_file: ""
    ca_file: ""

# ============================================
# HTTP Configuration
# ============================================
http:
  health:
    enabled: true
    listen: ${DETECTVIZ__HTTP__HEALTH__LISTEN:-:8081}
    livez_path: "/livez"
    readyz_path: "/readyz"

  demo:
    enabled: ${DETECTVIZ__HTTP__DEMO__ENABLED:-false}
    listen: ${DETECTVIZ__HTTP__DEMO__LISTEN:-:7777}
    base_path: "/demo"

# ============================================
# Metrics Provider Configuration
# ============================================
metrics_provider:
  # Provider type: prometheus, mimir (future), memory (testing)
  type: ${METRICS_PROVIDER_TYPE:-prometheus}

  # Query routing configuration (for future multi-provider setup)
  routing:
    short_term_days: 30
    long_term_provider: mimir # Reserved for future

  # Prometheus configuration
  prometheus:
    url: ${PROMETHEUS_URL:-http://localhost:9090}
    timeout: 30s
    retry:
      enabled: true
      max_attempts: 3
      backoff: 2s
    query:
      max_samples: 50000000
      max_concurrent: 10
      cache:
        enabled: true
        ttl: 5m
        max_size: 1000

    # Circuit Breaker configuration (optional)
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      recovery_timeout: 30s

    # Basic auth (optional)
    basic_auth:
      username: ${PROMETHEUS_USERNAME:-}
      password: ${PROMETHEUS_PASSWORD:-}

    # TLS configuration (optional)
    tls:
      enabled: false
      insecure_skip_verify: false
      cert_file: ""
      key_file: ""
      ca_file: ""

  # Mimir configuration (reserved for future)
  mimir:
    enabled: false
    url: ${MIMIR_URL:-}
    tenant_id: ${MIMIR_TENANT_ID:-}
    # Additional Mimir config will be added when implemented

  # Memory provider (for testing)
  memory:
    seed_data: true
    data_points: 1000

# ============================================
# Observability Configuration
# ============================================
observability:
  mode: ${DETECTVIZ__OBSERVABILITY__MODE:-lgtm_local}
  service_name: ${DETECTVIZ__OBSERVABILITY__SERVICE_NAME:-detectviz-platform}
  service_version: ${DETECTVIZ__OBSERVABILITY__SERVICE_VERSION:-1.0.0}
  environment: ${DETECTVIZ__OBSERVABILITY__ENVIRONMENT:-development}

  # OpenTelemetry configuration
  otlp:
    endpoint: ${DETECTVIZ__OBSERVABILITY__OTLP__ENDPOINT:-localhost:4317}
    insecure: true
    headers: {}

  # Logging configuration
  logging:
    level: ${DETECTVIZ__OBSERVABILITY__LOGGING__LEVEL:-info}
    format: ${DETECTVIZ__OBSERVABILITY__LOGGING__FORMAT:-json}
    output: ${DETECTVIZ__OBSERVABILITY__LOGGING__OUTPUT:-stdout}

  # Tracing configuration
  tracing:
    enabled: true
    sampling_ratio: ${DETECTVIZ__OBSERVABILITY__TRACING__SAMPLING_RATIO:-1.0}

  # Metrics configuration
  metrics:
    enabled: true
    interval: 60s

  # Profiling configuration
  profiling:
    enabled: true
    pprof_address: ${DETECTVIZ__OBSERVABILITY__PROFILING__PPROF_ADDRESS:-:6060}

# ============================================
# Plugin Configuration
# ============================================
plugins:
  registry:
    enabled: true
    scan_interval: 30s
    directories:
      - ./plugins
      - /etc/detectviz/plugins

  # Plugin-specific configurations
  health_aggregator:
    enabled: true
    parallel_queries: 10
    timeout: 30s

  report_generator:
    enabled: true
    output_dir: ${REPORT_OUTPUT_DIR:-./reports}
    templates_dir: ${REPORT_TEMPLATES_DIR:-./templates}
    formats:
      - markdown
      - json

  dashboard_builder:
    enabled: true
    auto_create: true
    retention_days: 90
    template: "postmortem_standard"

  knowledge_base:
    enabled: true
    auto_update: true
    similarity_threshold: 0.8
    max_similar_incidents: 5
    provider: ${KB_PROVIDER:-postgresql}

    # PostgreSQL configuration
    postgresql:
      host: ${POSTGRES_HOST:-localhost}
      port: ${POSTGRES_PORT:-5432}
      database: ${POSTGRES_DB:-detectviz}
      username: ${POSTGRES_USER:-detectviz}
      password: ${POSTGRES_PASSWORD:-}
      ssl_mode: ${POSTGRES_SSLMODE:-disable}
      max_connections: 10

    # Memory provider (for testing)
    memory:
      max_items: 1000

# ============================================
# External Services Configuration
# ============================================
external_services:
  # Grafana Configuration
  grafana:
    enabled: true
    url: ${GRAFANA_URL:-http://localhost:3000}
    api_key: ${GRAFANA_API_KEY}
    org_id: ${GRAFANA_ORG_ID:-1}

    # Dashboard settings
    dashboard:
      auto_create: true
      folder: "Postmortem"
      uid_prefix: "pm-"
      tags:
        - postmortem
        - incident
        - automated

    # Alert configuration
    alerting:
      enabled: true
      contact_point: "detectviz-webhook"
      evaluation_interval: "1m"

    timeout: 30s
    retry:
      enabled: true
      max_attempts: 3

  # Redis Configuration (for state management)
  redis:
    enabled: true
    address: ${REDIS_ADDRESS:-localhost:6379}
    password: ${REDIS_PASSWORD:-}
    db: ${REDIS_DB:-0}
    max_retries: 3
    pool_size: 10
    ttl: 3600 # 1 hour

  # Slack Configuration (Optional)
  slack:
    enabled: ${SLACK_ENABLED:-false}
    webhook_url: ${SLACK_WEBHOOK_URL:-}
    channel: ${SLACK_CHANNEL:-#incidents}
    username: "Detectviz Bot"
    icon_emoji: ":robot_face:"
    notifications:
      on_complete: true
      on_error: true
      include_summary: true

  # PagerDuty Configuration (Optional)
  pagerduty:
    enabled: ${PAGERDUTY_ENABLED:-false}
    api_key: ${PAGERDUTY_API_KEY:-}
    integration_key: ${PAGERDUTY_INTEGRATION_KEY:-}
    auto_resolve: true

# ============================================
# Agent Configuration (Python ADK)
# ============================================
agents:
  # ADK Model configuration
  model:
    provider: ${ADK_MODEL_PROVIDER:-gemini}
    api_key: ${ADK_MODEL_API_KEY}
    default_model: "gemini-2.0-flash"
    temperature: 0.7
    max_tokens: 4096

  # Postmortem Orchestrator
  postmortem_orchestrator:
    enabled: true
    max_execution_time: 300s
    retry_policy:
      max_attempts: 3
      backoff_multiplier: 2

  # Sub-agents configuration
  data_collector:
    enabled: true
    parallel_collection: true

  root_cause_analyzer:
    enabled: true
    analysis_depth: "standard" # basic, standard, deep

  report_writer:
    enabled: true
    include_recommendations: true
    max_recommendations: 5

# ============================================
# Security Configuration
# ============================================
security:
  auth:
    enabled: ${AUTH_ENABLED:-false}
    type: "jwt" # jwt, oauth2, basic
    jwt:
      secret: ${JWT_SECRET:-}
      issuer: "detectviz"
      audience: "detectviz-platform"
      expiry: "24h"

  rate_limiting:
    enabled: true
    requests_per_minute: 100
    burst: 20

  cors:
    enabled: true
    allowed_origins:
      - "http://localhost:3000"
      - "https://grafana.example.com"
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
    allowed_headers:
      - Content-Type
      - Authorization

# ============================================
# Performance Tuning
# ============================================
performance:
  worker_pool_size: ${WORKER_POOL_SIZE:-10}
  queue_size: ${QUEUE_SIZE:-100}
  batch_size: ${BATCH_SIZE:-50}

  timeouts:
    default: 30s
    query: 60s
    analysis: 300s
    report_generation: 120s

  cache:
    enabled: true
    provider: "redis" # redis, memory
    ttl: 300s
    max_size: 10000

# ============================================
# Feature Flags
# ============================================
features:
  postmortem: true
  dashboard_creation: true
  knowledge_base: true
  auto_remediation: false # Future
  capacity_planning: false # Future
  cost_optimization: false # Future
  multi_cloud: false # Future
  mimir_storage: false # Future

# ============================================
# Development Settings
# ============================================
development:
  debug: ${DEBUG:-false}
  verbose_logging: ${VERBOSE_LOGGING:-false}
  mock_external_services: ${MOCK_EXTERNAL:-false}
  hot_reload: ${HOT_RELOAD:-false}

  # Test data generation
  test_data:
    enabled: ${TEST_DATA_ENABLED:-false}
    incident_count: 10
    metrics_per_incident: 100
