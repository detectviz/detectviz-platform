# Detectviz 平台最小設定
env: dev
grpc:
  listen: ":6606"
  max_recv_bytes: 4194304
  max_send_bytes: 4194304
observability:
  mode: lgtm_local # lgtm_local | grafana_cloud | gcp
  otlp:
    protocol: grpc # grpc | http
    endpoint: "127.0.0.1:4317" # 指向本機 Alloy OTLP gRPC；若使用 HTTP，改成 http://127.0.0.1:4318 並將 protocol 設為 http
    insecure: true
    headers: {}
  logs:
    mode: file # file | stdout | off
    file:
      path: ./var/log/detectviz/detectviz.log
      max_size_mb: 50
      max_backups: 7
      max_age_days: 14
      compress: true
  profiling:
    enabled: true
    pprof_address: "127.0.0.1:6060" # 由 Alloy pyroscope.scrape 抓取
    application_name: "go-platform"
    tags:
      service.name: "go-platform"
      deployment.environment: "dev"
  resource:
    service_name: go-platform
    service_version: "0.1.0"
    environment: dev
  sampling:
    ratio: 1.0
plugin:
  paths: ["./go-platform/internal/pluginhost/plugins"]
  registry: file
memory:
  backend: inmem
  dsn: ""
  default_ttl_seconds: 3600
